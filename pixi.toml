[project]
name = "use-agentic-ai-in-science"
version = "0.1.0"
description = "Teaching repository for agentic AI in scientific research"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.26"
pandas = ">=2.2"
scipy = ">=1.13"
statsmodels = ">=0.14"
matplotlib = ">=3.9"
seaborn = ">=0.13"
pillow = ">=10.0"
requests = ">=2.31"
pyyaml = ">=6.0"
pytest = ">=8.0"
ruff = ">=0.6"

[tasks]
reproduce = "python example-study/02_data/generate_dataset.py && python example-study/03_analysis/run_analysis.py && python example-study/04_figures/make_figures.py && python tools/figure_qa.py example-study/04_figures/output"
test = "pytest -v"
